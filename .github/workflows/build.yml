name: CI / Build Image

# Builds + pushes the randomquotes image to GHCR. That's it — Octopus's
# external-feed trigger (`Auto-release on new randomquotes-image`, applied
# to every project in `tofu/app-randomquotes/`) sees the new tag, mints a
# release with the image tag as the release version, and the lifecycle's
# Dev auto-deploy target fires it. No `octopus release create` /
# `octopus release deploy` from CI.
#
# (Note: Octopus's `Octopus.ArgoCDUpdateImageTags` step writes image tags
# into the helm chart values under `gitops/`, which sits outside this
# filter, so the build → release → image-update loop can't form.)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/octopus-iac-lab

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        # Pin a 1.1.x base so we don't collide with 1.0.x tags from earlier
        # workflow incarnations sitting in GHCR. Bump the major prefix
        # whenever this workflow file gets recreated.
        # On PRs, also publish a `pr-N` tag so Argo's preview ApplicationSet
        # can pin to the branch's image (otherwise previews show stale
        # `:latest` from main).
        run: |
          echo "version=1.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_tag=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Build and push (preview)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.pr_tag }}
          build-args: VERSION=${{ steps.version.outputs.pr_tag }}

  push-build-info:
    # Push GitHub-sourced build information (commits, build URL, VCS root) to
    # both Octopus targets after the image lands. The external-feed trigger
    # mints the release from the image tag; this step attaches commit history
    # so the resulting release page shows "what changed" without us minting
    # the release from CI. Skipped on PRs — only `main` builds become releases.
    name: Push Build Info → Octopus
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: local
            url_secret: OCTOPUS_LOCAL_URL
            key_secret: OCTOPUS_LOCAL_API_KEY
          - name: saas
            url_secret: OCTOPUS_SAAS_URL
            key_secret: OCTOPUS_SAAS_API_KEY
    steps:
      - uses: actions/checkout@v4

      # Local leg is best-effort — if its URL is unreachable from GHA the
      # job continues; SaaS is the source of truth.
      - name: Push build information (${{ matrix.target.name }})
        continue-on-error: ${{ matrix.target.name == 'local' }}
        uses: OctopusDeploy/push-build-information-action@v4
        env:
          OCTOPUS_URL: ${{ secrets[matrix.target.url_secret] }}
          OCTOPUS_API_KEY: ${{ secrets[matrix.target.key_secret] }}
          OCTOPUS_SPACE: IaC Sandbox
        with:
          # Docker feed package IDs are the image repo without tag — the GHCR
          # feed registered in tofu/control-plane/feeds.tf resolves this.
          packages: ${{ env.IMAGE }}
          version: ${{ needs.build.outputs.version }}
          # Build info push happens just after image push; if a previous run
          # of the same workflow already wrote info for this version (re-run
          # of the same run_number), prefer overwrite over failing the job.
          overwrite_mode: OverwriteExisting

