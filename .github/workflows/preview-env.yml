name: Preview Env / Octopus Runbook

# Octopus mirror of the Argo PR-preview ApplicationSet
# (gitops/argocd/randomquotes-applicationset-previews.yaml). Argo polls
# GitHub for `feat/*` PRs and fans out a leaf Application per PR; this
# workflow fires the equivalent Octopus runbook for the same PR. Same
# image (`pr-<N>` from build.yml's pull_request leg), different
# namespace prefix on the cluster (argo-randomquotes-preview-pr-<N> vs
# randomquotes-preview-pr-<N>) so both paths coexist.
#
# All feat/* PRs trigger this — no per-branch opt-in. The Argo side
# already opts everyone in via branchMatch: "^feat/.*"; staying in sync
# keeps the side-by-side comparison honest.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

env:
  # Preview runs as a runbook on the main `randomquotes` project rather
  # than as its own project — the spin-up and teardown OCL lives in
  # `.octopus/runbooks/`. The runbook is untenanted so it doesn't need a
  # tenant context.
  PROJECT: randomquotes
  RUNBOOK_SPIN_UP: Spin up preview
  RUNBOOK_TEARDOWN: Teardown preview

jobs:
  spin-up:
    name: Spin up preview env (PR ${{ github.event.number }})
    if: github.event.action != 'closed' && startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: local, url_secret: OCTOPUS_LOCAL_URL, key_secret: OCTOPUS_LOCAL_API_KEY }
          - { name: saas,  url_secret: OCTOPUS_SAAS_URL,  key_secret: OCTOPUS_SAAS_API_KEY  }
    steps:
      - name: Run "${{ env.RUNBOOK_SPIN_UP }}" on ${{ matrix.target.name }}
        # Local leg is best-effort — SaaS is the source of truth.
        continue-on-error: ${{ matrix.target.name == 'local' }}
        uses: OctopusDeploy/run-runbook-action@v3
        env:
          OCTOPUS_URL: ${{ secrets[matrix.target.url_secret] }}
          OCTOPUS_API_KEY: ${{ secrets[matrix.target.key_secret] }}
          OCTOPUS_SPACE: IaC Sandbox
        with:
          project: ${{ env.PROJECT }}
          runbook: ${{ env.RUNBOOK_SPIN_UP }}
          environments: Dev
          variables: |
            PR.Number: ${{ github.event.number }}
            PR.Branch: ${{ github.head_ref }}
            PR.HeadSha: ${{ github.event.pull_request.head.sha }}

  teardown:
    name: Tear down preview env (PR ${{ github.event.number }})
    if: github.event.action == 'closed' && startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: local, url_secret: OCTOPUS_LOCAL_URL, key_secret: OCTOPUS_LOCAL_API_KEY }
          - { name: saas,  url_secret: OCTOPUS_SAAS_URL,  key_secret: OCTOPUS_SAAS_API_KEY  }
    steps:
      - name: Run "${{ env.RUNBOOK_TEARDOWN }}" on ${{ matrix.target.name }}
        continue-on-error: ${{ matrix.target.name == 'local' }}
        uses: OctopusDeploy/run-runbook-action@v3
        env:
          OCTOPUS_URL: ${{ secrets[matrix.target.url_secret] }}
          OCTOPUS_API_KEY: ${{ secrets[matrix.target.key_secret] }}
          OCTOPUS_SPACE: IaC Sandbox
        with:
          project: ${{ env.PROJECT }}
          runbook: ${{ env.RUNBOOK_TEARDOWN }}
          environments: Dev
          variables: |
            PR.Number: ${{ github.event.number }}
            PR.Branch: ${{ github.head_ref }}
