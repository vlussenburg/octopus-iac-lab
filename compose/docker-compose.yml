# Local Octopus Server sandbox — HA topology. Two Octopus Server nodes share
# one SQL DB and one set of named volumes, fronted by an nginx LB doing HTTP
# (UI + REST) and TCP (Halibut polling, KLOS gRPC) load balancing.
#
# Why HA-only: Octopus's HA mode exercises real production semantics — node
# coordination via the DB, shared task queue, master-key consistency — that
# a single-node setup quietly skips. Easier to learn the right way once.
#
# Single-host caveat: this works because both nodes hit the same Linux
# kernel, so fcntl/flock advisory locks behave correctly across the shared
# volumes. Across multiple hosts you'd swap the named volumes for NFS / EFS
# / Azure Files. (And in the lab, that's exactly what `tofu/k8s-agent/` sets
# up via the NFS CSI driver — same trick, different layer.)
#
# Apple Silicon: both Octopus + SQL Server images are amd64 — enable Docker
# Desktop → Settings → General → "Use Rosetta" for native-ish speed.

# Pinned project name so containers + named volumes stay stable regardless
# of where this file lives on disk.
name: selfhost-setup

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    # SQL Server's default behaviour is to grow the buffer pool until it
    # owns most of the container's available memory, which on this lab
    # squeezes Octopus + Docker Desktop K8s into a noisy fight. Cap the
    # engine + container explicitly. Tune up if you bump Docker Desktop's
    # overall allocation (Settings → Resources). With Docker Desktop at
    # 16 GB this leaves comfortable headroom for both Octopus nodes + K8s.
    mem_limit: 8g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Octop@s!Sandb0x"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Octop@s!Sandb0x' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mssql-data:/var/opt/mssql

  # First Octopus node. Boots solo against the empty DB so first-run
  # migrations and master-key setup happen on a single node before the
  # second joins.
  octopus-1:
    image: octopusdeploy/octopusdeploy:latest
    platform: linux/amd64
    mem_limit: 2g
    cpus: 2
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      DB_CONNECTION_STRING: "Server=db,1433;Database=OctopusDeploy;User=sa;Password=Octop@s!Sandb0x;TrustServerCertificate=True"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Password01!"
      OCTOPUS_SERVER_NODE_NAME: "OctopusNode1"
      MASTER_KEY: "${MASTER_KEY}"
      # If set, install.sh runs `Octopus.Server license --licenseBase64=…`
      # on boot. Empty = skip (paste in UI). Sourced from .env via
      # --env-file; encode once with `base64 -i license.xml | tr -d '\n'`.
      OCTOPUS_SERVER_BASE64_LICENSE: "${OCTOPUS_SERVER_BASE64_LICENSE:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - octopus-repository:/repository
      - octopus-artifacts:/artifacts
      - octopus-tasklogs:/taskLogs

  # Second node waits for octopus-1 to be healthy so first-boot migrations
  # finish before the second joins. Skip licence apply on this one — node 1
  # already did it.
  octopus-2:
    image: octopusdeploy/octopusdeploy:latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      octopus-1:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      DB_CONNECTION_STRING: "Server=db,1433;Database=OctopusDeploy;User=sa;Password=Octop@s!Sandb0x;TrustServerCertificate=True"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Password01!"
      OCTOPUS_SERVER_NODE_NAME: "OctopusNode2"
      MASTER_KEY: "${MASTER_KEY}"
      OCTOPUS_SERVER_BASE64_LICENSE: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - octopus-repository:/repository
      - octopus-artifacts:/artifacts
      - octopus-tasklogs:/taskLogs

  # nginx with the `stream` module — load-balances HTTP (UI + REST API) and
  # TCP (Halibut polling, KLOS gRPC). Both modules ship in nginx:alpine.
  # Host 18443 → container 8443 dodges Docker Desktop's own *:8443 binding;
  # Argo CD Gateway connects via grpc://host.docker.internal:18443.
  lb:
    image: nginx:alpine
    depends_on:
      octopus-1:
        condition: service_healthy
      octopus-2:
        condition: service_healthy
    ports:
      - "8090:80"        # HTTP API + UI (load-balanced round-robin)
      - "10943:10943"    # Halibut polling (TCP load-balanced)
      - "18443:8443"     # KLOS / Argo CD Gateway gRPC (TCP load-balanced)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  default-pool-worker:
    image: octopusdeploy/tentacle:latest
    platform: linux/amd64
    privileged: true
    mem_limit: 1500m
    cpus: 2
    depends_on:
      lb:
        condition: service_started
    environment:
      ACCEPT_EULA: "Y"
      ServerApiKey: "${OCTOPUS_API_KEY}"
      ServerUrl: "http://lb:80"
      ServerCommsAddress: "Polling://lb:10943/"
      Space: "IaC Sandbox"
      TargetName: "default-pool-worker"
      TargetWorkerPool: "Default Worker Pool"
      MachinePolicy: "Default Machine Policy"
    restart: unless-stopped
    volumes:
      - default-pool-tentacle-config:/etc/octopus
      - default-pool-tentacle-home:/home/Octopus

  prod-pool-worker:
    image: octopusdeploy/tentacle:latest
    platform: linux/amd64
    privileged: true
    mem_limit: 1500m
    cpus: 2
    depends_on:
      lb:
        condition: service_started
    environment:
      ACCEPT_EULA: "Y"
      ServerApiKey: "${OCTOPUS_API_KEY}"
      ServerUrl: "http://lb:80"
      ServerCommsAddress: "Polling://lb:10943/"
      Space: "IaC Sandbox"
      TargetName: "prod-pool-worker"
      TargetWorkerPool: "prod-pool"
      MachinePolicy: "Default Machine Policy"
    restart: unless-stopped
    volumes:
      - polling-tentacle-config:/etc/octopus
      - polling-tentacle-home:/home/Octopus

volumes:
  mssql-data:
  octopus-repository:
  octopus-artifacts:
  octopus-tasklogs:
  polling-tentacle-config:
  polling-tentacle-home:
  default-pool-tentacle-config:
  default-pool-tentacle-home:
