# Image tag for saas/production. Owned by Octopus's
# 'Update Argo CD Application Image Tags' step — Octopus rewrites the
# tag here on every deployment to production from the saas project. Do not
# hand-edit unless you know what you're doing; the next deploy will
# overwrite. Leaf Apps reference this via spec.source.helm.valueFiles.
#
# Empty default = "no Octopus promote has landed yet". The chart's
# deployment.yaml is guarded `{{- if .Values.image.tag }}` so an empty
# tag renders a no-op Application (namespace + Service + Ingress still
# created, but zero pods). First Octopus promote writes a real tag here
# and the Deployment materialises.
# envType drives the workload kind: "production" renders the Argo
# Rollouts canary (templates/rollout.yaml); anything else renders a
# plain Deployment. Production-tier acme-corp runs 3 replicas, which
# is where canary weight steps (20/40/60/80) actually shift visible
# pod fractions.
envType: production
image:
  repository: vlussenburg/octopus-iac-lab
  tag: "1.1.191"
