# Defaults. Effective values per leaf Application are layered as:
#   values.yaml (this file)              — chart defaults
#   < values-{local,saas}-{dev,prod}.yaml — per-(Octopus, env) image.tag,
#                                           rewritten by Octopus's
#                                           update-argo-cd-application-image-tags
#                                           step on every deploy
#   < spec.source.helm.valuesObject       — per-tenant config (mood, icon,
#                                           color, host, replicaCount)
# The split is required because Octopus only writes to values *files*,
# not inline valuesObject — so image.tag has to live in a referenced
# file to be reachable by the step.

image:
  # Full path is "ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}".
  repository: vlussenburg/octopus-iac-lab
  # No tag default on purpose. Every Application overrides via its
  # values-<src>-<env>.yaml — that's where Octopus's annotation-driven
  # update-image-tags step writes per-environment. A default here used
  # to silently mask Octopus's writes: chart default rendered as a fixed
  # tag even after Octopus had updated the per-env file, because Helm
  # precedence picked the per-env override but Octopus's step had been
  # writing to this chart-default value (no Argo render consumed it).
  # Without a default, the chart strictly requires a values file —
  # exactly what every leaf Application provides via valueFiles.

replicaCount: 1

# Subscription tier — drives per-tier policy in Platform Hub's Rego bundle
# (replica caps, watermark, …). Mirrors the existing Octopus `tier/*` tenant
# tag so the chart and Octopus agree on which tenant is which.
# One of: free | pro | enterprise.
tier: free

# Per-tenant config that ends up in /usr/share/nginx/html/config.json.
tenant: ""
mood: ""
icon: ""
brandColor: ""
watermark: ""

# nginx-ingress host. *.localtest.me resolves to 127.0.0.1, so a single
# port-forward `kubectl port-forward svc/ingress-nginx-controller 8080:8080
# -n ingress-nginx` reaches every tenant's app at its own host.
host: ""

resources:
  requests:
    # Lab footprint — the nginx demo app is idle most of the time. 10m
    # keeps ~60 pods schedulable on a Docker Desktop node without
    # bumping CPU allocation in Settings.
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi