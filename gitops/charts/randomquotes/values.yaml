# Defaults — overridden per-Application via spec.source.helm.valuesObject in
# each leaf under gitops/applications/randomquotes/{local,saas}/. Anything
# left at default here will surface as an unconfigured tenant on the page,
# which is a useful signal when you forget to wire a new App.

image:
  # Full path is "ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}".
  # Octopus's update-argo-cd-application-image-tags step bumps `tag` and
  # uses the argo.octopus.com/image-replace-paths annotation on each leaf
  # to know where the tag lives in this template.
  repository: vlussenburg/octopus-iac-lab
  # The chart-default tag isn't actually consumed today — every leaf
  # pins image.tag in its spec.source.helm.valuesObject. Keep this as a
  # sentinel so a forgotten override is obvious in the rendered manifest.
  tag: 1.1.19

replicaCount: 1

# Per-tenant config that ends up in /usr/share/nginx/html/config.json.
tenant: ""
mood: ""
icon: ""
brandColor: ""
watermark: ""

# nginx-ingress host. *.localtest.me resolves to 127.0.0.1, so a single
# port-forward `kubectl port-forward svc/ingress-nginx-controller 8080:8080
# -n ingress-nginx` reaches every tenant's app at its own host.
host: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Blue/green is the only deployment shape this chart renders — every release
# goes through an Argo Rollout. The Rollouts controller (installed
# cluster-wide via tofu/k8s-agent/argo_rollouts.tf) handles the parallel
# ReplicaSet + active Service selector swap + scale-down of the old.
#
# Two operational modes:
#
# - autoPromotion: true (default) — atomic. Controller swaps the active
#   selector as soon as the new ReplicaSet is healthy, then scales the
#   old down. Hard binary cut (no half-rolled requests). Matches the
#   behavior of Octopus's KubernetesDeployContainers + BlueGreen step on
#   the bluegreen-lab project — same pattern, two ecosystems.
#
# - autoPromotion: false — gated. The new ReplicaSet stays running but
#   receives no active traffic; reach it at blueGreen.previewHost for
#   smoke testing. Promote with `kubectl argo rollouts promote
#   randomquotes`. Adds a human-in-the-loop gate.
blueGreen:
  autoPromotion: true
  # Host for the preview (green) ingress while a new version is staged.
  # Only consumed when autoPromotion = false.
  previewHost: ""
