# Defaults. Effective values per leaf Application are layered as:
#   values.yaml (this file)              — chart defaults
#   < values-{local,saas}-{dev,prod}.yaml — per-(Octopus, env) image.tag,
#                                           rewritten by Octopus's
#                                           update-argo-cd-application-image-tags
#                                           step on every deploy
#   < spec.source.helm.valuesObject       — per-tenant config (mood, icon,
#                                           color, host, replicaCount)
# The split is required because Octopus only writes to values *files*,
# not inline valuesObject — so image.tag has to live in a referenced
# file to be reachable by the step.

# Demo flavour selector. The main `randomquotes` apps use Deployment.
# Demo flavours that need blue/green semantics on the GitOps path (the
# blue-green and bg-preview demos) set this to Rollout via their
# Application valuesObject, and the chart renders an Argo Rollout (and
# optionally a preview Service + Ingress) instead.
workloadType: Deployment

rollout:
  # Atomic vs gated blue/green. true → cutover when healthy (matches the
  # blue-green demo); false → wait for an external promote signal (matches
  # the bg-preview demo).
  autoPromotionEnabled: true
  previewService:
    # When true, a randomquotes-preview Service is rendered and (if a
    # previewHost value is set) a matching Ingress, exposing the candidate
    # ReplicaSet at a separate URL while the active ingress keeps serving
    # the old one.
    enabled: false

# Hostname for the preview Ingress. Empty by default — only the bg-preview
# flavour sets this in its Application valuesObject.
previewHost: ""

image:
  # Full path is "ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}".
  repository: vlussenburg/octopus-iac-lab
  # Sentinel default — every Application overrides via its values-<src>-<env>.yaml.
  # If you ever see this tag in a rendered manifest, a values file got
  # disconnected.
  tag: 1.1.64

replicaCount: 1

# Subscription tier — drives per-tier policy in Platform Hub's Rego bundle
# (replica caps, watermark, …). Mirrors the existing Octopus `tier/*` tenant
# tag so the chart and Octopus agree on which tenant is which.
# One of: free | pro | enterprise.
tier: free

# Per-tenant config that ends up in /usr/share/nginx/html/config.json.
tenant: ""
mood: ""
icon: ""
brandColor: ""
watermark: ""

# nginx-ingress host. *.localtest.me resolves to 127.0.0.1, so a single
# port-forward `kubectl port-forward svc/ingress-nginx-controller 8080:8080
# -n ingress-nginx` reaches every tenant's app at its own host.
host: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi