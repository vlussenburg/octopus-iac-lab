# Argo Rollout — drop-in replacement for Deployment. The Rollouts controller
# (installed cluster-wide via tofu/k8s-agent/argo_rollouts.tf) handles the
# blue/green dance atomically: stage new ReplicaSet → wait healthy → swap
# the active Service selector → scale old down.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: randomquotes
  labels:
    app: randomquotes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  strategy:
    blueGreen:
      activeService: randomquotes
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: randomquotes
      annotations:
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          image: ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
