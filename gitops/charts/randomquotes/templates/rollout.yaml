# Argo Rollout — drop-in replacement for Deployment. Used unconditionally;
# the Rollouts controller (installed cluster-wide via
# tofu/k8s-agent/argo_rollouts.tf) drives this through a blue/green
# strategy. Atomic by default — see values.yaml's blueGreen block.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: randomquotes
  labels:
    app: randomquotes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  strategy:
    blueGreen:
      activeService: randomquotes
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotion }}
      scaleDownDelaySeconds: 30
      {{- if not .Values.blueGreen.autoPromotion }}
      previewService: randomquotes-preview
      {{- end }}
  template:
    metadata:
      labels:
        app: randomquotes
      annotations:
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          image: ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
