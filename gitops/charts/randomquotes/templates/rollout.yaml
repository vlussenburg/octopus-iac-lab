{{- if and .Values.image.tag (eq .Values.envType "production") }}
# Atomic blue/green via Argo Rollouts — production only. On Dev the
# tenant runs a single replica, which makes blue/green degenerate to a
# 1-pod swap with no meaningful "blue" vs "green" — so Dev renders the
# plain Deployment in deployment.yaml instead. autoPromotionEnabled=true
# means the controller cuts the active Service over to the new
# ReplicaSet the moment it becomes healthy — no operator gate, no
# preview hostname. Companion to the agent-path Rollout in
# .octopus-blue-green/deployment_process.ocl; this is the GitOps path's
# rendering of the same shape.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: randomquotes
  labels:
    app: randomquotes
    app.kubernetes.io/name: randomquotes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: randomquotes
    tenant.octopus.com/tier: {{ .Values.tier | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  strategy:
    blueGreen:
      activeService: randomquotes
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: randomquotes
        app.kubernetes.io/name: randomquotes
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: randomquotes
        tenant.octopus.com/tier: {{ .Values.tier | quote }}
      annotations:
        # Roll the pod when the ConfigMap content changes — k8s doesn't
        # auto-restart on volume-mount updates.
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          image: ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
{{- end }}
