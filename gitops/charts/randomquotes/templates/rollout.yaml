# Argo Rollout — gated blue/green. Replaces the chart's plain Deployment
# for this demo. autoPromotionEnabled=false means each release stages a
# new ReplicaSet behind `previewService` and waits for an explicit
# `kubectl argo rollouts promote` before swapping the active Service.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: randomquotes
  labels:
    app: randomquotes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  strategy:
    blueGreen:
      activeService: randomquotes
      previewService: randomquotes-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: randomquotes
      annotations:
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          image: ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
