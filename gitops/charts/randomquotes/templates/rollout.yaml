{{- if eq (default "Deployment" .Values.workloadType) "Rollout" }}
# Argo Rollout — used by the demo flavours that need blue/green semantics
# on the GitOps path (blue-green, bg-preview). Same image+config as the
# Deployment shape; the strategy block is what differs.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: randomquotes
  labels:
    app: randomquotes
    app.kubernetes.io/name: randomquotes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: randomquotes
    tenant.octopus.com/tier: {{ .Values.tier | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  strategy:
    blueGreen:
      activeService: randomquotes
      {{- if .Values.rollout.previewService.enabled }}
      previewService: randomquotes-preview
      {{- end }}
      autoPromotionEnabled: {{ .Values.rollout.autoPromotionEnabled }}
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: randomquotes
        app.kubernetes.io/name: randomquotes
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: randomquotes
        tenant.octopus.com/tier: {{ .Values.tier | quote }}
      annotations:
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          image: ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
{{- end }}
