{{- if and .Values.image.tag (eq .Values.envType "production") }}
# Argo Rollouts canary with NGINX trafficRouting. The chart's plain
# Deployment is replaced by this Rollout for the canary demo; Argo
# Rollouts manages the stableService / canaryService selectors and
# auto-creates the canary Ingress (mirrored off stableIngress) carrying
# the nginx.ingress.kubernetes.io/canary + canary-weight annotations
# that actually shift traffic between ReplicaSets.
#
# Production-only: at Dev tier acme-corp runs 1 replica, where canary
# weight steps are meaningless (a ReplicaSet can have 0 or 1 pods, not
# 20%). Dev gets the plain Deployment from templates/deployment.yaml.
#
# Mirrors the agent-path Rollout in
# .octopus-canary/deployment_process.ocl — same steps, same weights, so
# both delivery paths render the same canary shape on the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: randomquotes
  labels:
    app: randomquotes
    app.kubernetes.io/name: randomquotes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: randomquotes
    tenant.octopus.com/tier: {{ .Values.tier | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  strategy:
    canary:
      canaryService: randomquotes-canary
      stableService: randomquotes
      trafficRouting:
        nginx:
          stableIngress: randomquotes
      scaleDownDelaySeconds: 30
      steps:
        - setWeight: 20
        - pause: { duration: 20 }
        - setWeight: 40
        - pause: { duration: 20 }
        - setWeight: 60
        - pause: { duration: 20 }
        - setWeight: 80
        - pause: { duration: 20 }
  template:
    metadata:
      labels:
        app: randomquotes
        app.kubernetes.io/name: randomquotes
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: randomquotes
        tenant.octopus.com/tier: {{ .Values.tier | quote }}
      annotations:
        # Roll the pod when the ConfigMap content changes — k8s doesn't
        # auto-restart on volume-mount updates.
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          image: ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
{{- end }}
