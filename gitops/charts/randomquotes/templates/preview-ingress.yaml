{{- if and (eq (default "Deployment" .Values.workloadType) "Rollout") .Values.rollout.previewService.enabled .Values.previewHost }}
# Preview Ingress — same chart, separate hostname pointing at the preview
# service. Operators visit this URL to verify the candidate while live
# traffic still hits the active ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: randomquotes-preview
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.previewHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: randomquotes-preview
                port:
                  number: 80
{{- end }}
