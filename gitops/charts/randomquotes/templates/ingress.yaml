apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: randomquotes
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: randomquotes
                port:
                  number: 80
{{- if not .Values.blueGreen.autoPromotion }}
---
# Preview ingress — only rendered in gated mode. Separate hostname for
# smoke-testing the green ReplicaSet before manual promotion. Same
# *.localtest.me trick: previewHost is typically `bg-{host}` so one
# port-forward covers both.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: randomquotes-preview
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.blueGreen.previewHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: randomquotes-preview
                port:
                  number: 80
{{- end }}
