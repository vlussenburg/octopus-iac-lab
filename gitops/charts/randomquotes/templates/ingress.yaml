apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: randomquotes
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: randomquotes
                port:
                  number: 80
---
# Preview Ingress — same chart, separate hostname (`bg-` prefix). Smoke-test
# the green ReplicaSet here before running `kubectl argo rollouts promote`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: randomquotes-preview
spec:
  ingressClassName: nginx
  rules:
    - host: bg-{{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: randomquotes-preview
                port:
                  number: 80
