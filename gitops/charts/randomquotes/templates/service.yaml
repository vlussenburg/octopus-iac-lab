# Active Service — what real users hit. The Rollouts controller rewrites
# the selector during promotion (auto when blueGreen.autoPromotion is
# true, manual via `kubectl argo rollouts promote` otherwise).
apiVersion: v1
kind: Service
metadata:
  name: randomquotes
spec:
  type: ClusterIP
  selector:
    app: randomquotes
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
{{- if not .Values.blueGreen.autoPromotion }}
---
# Preview Service — only rendered in gated mode. Points at the new (green)
# ReplicaSet from the moment it's created so you can smoke-test at
# blueGreen.previewHost before running `argo rollouts promote`.
apiVersion: v1
kind: Service
metadata:
  name: randomquotes-preview
spec:
  type: ClusterIP
  selector:
    app: randomquotes
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
{{- end }}
